<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="ea-scene-layout" content="immersive">
  <meta name="ea-scene-scroll-screens" content="6">
  <meta name="ea-scene-start-viewport" content="0.65">
  <meta name="ea-scene-handoff-screens" content="1">
  <meta name="ea-scene-handoff" content="overlay">
  <meta name="ea-scene-dark-range" content="0.25 1">
  <title>VR glasses</title>
  <style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;outline:0}#vignette{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(8,8,8,.13),transparent 45%,rgba(8,8,8,.82))}#static-gallery{display:none;position:absolute;inset:67% 5% 3%;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px}#static-gallery img{display:block;width:100%;height:100%;object-fit:contain}html[data-vr-motion=reduced] #static-gallery,html[data-vr-motion=fallback] #static-gallery{display:grid}html[data-vr-motion=fallback] canvas{display:none}html[data-vr-motion=fallback] #static-gallery{inset:5%}</style>
</head>
<body>
  <canvas role="img" aria-label="Animated virtual reality headset"></canvas>
  <div id="vignette" aria-hidden="true"></div>
  <div id="static-gallery"></div>
  <script src="./scene.bundle.js"></script>
</body>
</html>
