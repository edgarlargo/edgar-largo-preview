<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Roadster</title><link rel="stylesheet" href="../roadster-404/page.css"><style>html,body{min-width:0;min-height:0;height:100%;overflow:hidden}.roadster-stage{width:100%;height:100%;min-height:0;margin:0}.scene-controls{left:14px;right:14px;bottom:0}.scene-controls button{min-height:44px}.roadster-stage canvas{transition:none}:root,html,body{background:transparent;color-scheme:normal}</style><script defer src="../roadster-404/scene.bundle.js"></script></head><body><div class="roadster-stage" data-roadster-stage><canvas data-roadster-canvas role="img" aria-label="Silver Roadster. Drag or use arrow keys to rotate; Space pauses rotation."></canvas><div class="scene-controls"><p data-roadster-status role="status">Preparing your Roadster…</p><button data-roadster-pause type="button" aria-pressed="false" hidden>Pause rotation</button></div></div><script>
// Wheel input inside an iframe must reach the host page's scroll controller.
window.addEventListener('wheel', function(event) {
  if (event.ctrlKey || event.metaKey || window.parent === window) return;
  try {
    var frame = window.frameElement;
    if (!frame || !frame.classList.contains('largo-roadster-view')) return;
    var wheel = new parent.WheelEvent('wheel', {
      bubbles: true, cancelable: true,
      deltaX: event.deltaX, deltaY: event.deltaY, deltaMode: event.deltaMode
    });
    frame.dispatchEvent(wheel);
    var root = parent.document.scrollingElement;
    if (!wheel.defaultPrevented && root &&
        (root.scrollHeight > root.clientHeight || root.scrollWidth > root.clientWidth)) {
      var factor = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? parent.innerHeight : 1;
      parent.scrollBy(event.deltaX * factor, event.deltaY * factor);
    }
    event.preventDefault();
  } catch (_) { /* Standalone or cross-origin embeds keep their own input. */ }
}, { passive: false });
</script></body></html>
